[package]
name = "ddnser"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Dynamic DNS daemon"
keywords = ["dynamic", "ddns", "dns", "vercel"]
readme = "README.md"
repository = "https://github.com/thomasgassmann/vercel-ddns"
authors = [
    "Thomas Gassmann <thomas@gassmann.dev>",
    "Rodrigo Sanabria <rodrigosanabria22@gmail.com>"
]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private"] }
axum-reverse-proxy = { version = "1.3", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = { version = "0.18", features = ["key-expansion"] }
futures = "0.3"
mime_guess = "2"
openidconnect = "4"
public-ip = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "migrate",
    "derive",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
